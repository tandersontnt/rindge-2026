# Saves in-site copies of cited outside material (large town PDFs, public government pages) so they open inside the guide.
# Run from the Actions tab ("Run workflow"). Commits the copies to the branch it runs on.
name: Save in-site copies
on:
  workflow_dispatch:
  push:
    branches: [in-site-docs]
    paths: ['.github/workflows/snapshot.yml', 'src/snapshot_pages.py']
permissions:
  contents: write
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install beautifulsoup4==4.12.3 lxml==5.3.0 playwright==1.48.0 && python -m playwright install --with-deps chromium
      - name: Save copies
        run: python3 src/snapshot_pages.py index.html
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          git diff --cached --quiet && echo "nothing new" || git commit -m "Save in-site copies of cited outside material" && git push
